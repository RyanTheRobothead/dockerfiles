services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal@sha256:e8ab7f76d0aaace1062278ca5d5bea65e5b12af8dd0cc663d7af8e8641d0d37e
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock
  smokeping:
    image: ghcr.io/linuxserver/smokeping@sha256:52ab5b6bb2cbe03e775f970ac110300964d4069917820fccdfd6db80dd5ac143
    container_name: smokeping
    environment: 
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
    volumes:
      - /home/luckierdodge/cerberus-storage/config/smokeping/config:/config
      - /home/luckierdodge/cerberus-storage/data/smokeping/data:/data
    ports:
      - 8888:80
    restart: unless-stopped
  swag:
    image: linuxserver/swag@sha256:a2d5e3c41b9bb57e4717113b471109f9f9cca103e38ad6f19ee0fe46f4d27e75
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - URL=ryandlewis.dev
      - SUBDOMAINS=warden,request,cloud,foundry,jellyfin,plex,neofoundry,immich,audiobookshelf,collabora
      - ONLY_SUBDOMAINS=true
      - VALIDATION=http
      - EMAIL=public+letsencrypt@ryandlewis.dev
    volumes:
      - /home/luckierdodge/cerberus-storage/config/swag:/config
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest@sha256:05c1ca8215f958b674e8fa1c2ea43483efa54dae8f1dbe40c907af66821fdcae
    container_name: librespeed
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - PASSWORD=${LIBRESPEED_PASSWORD:-supersecretpassword}
    volumes:
      - /home/luckierdodge/cerberus-storage/config/librespeed/config:/config
    ports:
      - 8889:80
    restart: unless-stopped
  gatus:
    image: twinproduction/gatus:latest@sha256:215787ef82f7bd16c3b8e9055630b66f938914c8ff764ef9508e7d1d4d550bf0
    container_name: gatus
    restart: unless-stopped
    env_file: ./gatus.env
    ports:
      # Tailnet-only: nothing needs the status page from the internet
      - 100.93.94.128:8090:8080
      - "[fd7a:115c:a1e0:ab12:4843:cd96:625d:5e80]:8090:8080"
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - /home/luckierdodge/cerberus-storage/data/gatus/data:/data
