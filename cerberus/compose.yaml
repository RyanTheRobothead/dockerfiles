services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal@sha256:6c5160b1eb691c38148e7747a582e1a7fe19f9e170107cd2f915c0edb0660f99
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock
  smokeping:
    image: ghcr.io/linuxserver/smokeping@sha256:a2c7454fd46b1d9fdc273ad029db01fbb7f205d71bad08138edf6a380b965397
    container_name: smokeping
    environment: 
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
    volumes:
      - /home/luckierdodge/cerberus-storage/config/smokeping/config:/config
      - /home/luckierdodge/cerberus-storage/data/smokeping/data:/data
    ports:
      # Tailnet-only: nothing needs the latency graphs from the internet
      - 100.93.94.128:8888:80
      - "[fd7a:115c:a1e0:ab12:4843:cd96:625d:5e80]:8888:80"
    restart: unless-stopped
  swag:
    image: linuxserver/swag@sha256:34ca26b0b04130a2db511d871f224343b545792aa834bfc61b84199326cad170
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - URL=ryandlewis.dev
      - SUBDOMAINS=warden,request,cloud,foundry,jellyfin,plex,neofoundry,immich,audiobookshelf,collabora
      - ONLY_SUBDOMAINS=true
      - VALIDATION=http
      - EMAIL=public+letsencrypt@ryandlewis.dev
    volumes:
      - /home/luckierdodge/cerberus-storage/config/swag:/config
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest@sha256:98ddd2a1357f961392789e078d5511dd09cb7461f87a26e6fc9cfb6e69ba96a4
    container_name: librespeed
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - PASSWORD=${LIBRESPEED_PASSWORD:-supersecretpassword}
    volumes:
      - /home/luckierdodge/cerberus-storage/config/librespeed/config:/config
    ports:
      # Tailnet-only: nothing needs the speed test from the internet
      - 100.93.94.128:8889:80
      - "[fd7a:115c:a1e0:ab12:4843:cd96:625d:5e80]:8889:80"
    restart: unless-stopped
