services:
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal@sha256:b1517815087f04edd0b0c103d6df4ac5c4d6f22db5c62e32949e135a25f1d945
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock
  smokeping:
    image: ghcr.io/linuxserver/smokeping@sha256:0120aaf92cdc369e79fac21942fe02fca615aeb6e99541b926f53ec82b91ecfc
    container_name: smokeping
    environment: 
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
    volumes:
      - /home/luckierdodge/cerberus-storage/config/smokeping/config:/config
      - /home/luckierdodge/cerberus-storage/data/smokeping/data:/data
    ports:
      # Tailnet-only: nothing needs the latency graphs from the internet
      - 100.93.94.128:8888:80
      - "[fd7a:115c:a1e0:ab12:4843:cd96:625d:5e80]:8888:80"
    restart: unless-stopped
  swag:
    image: linuxserver/swag@sha256:f61b985594855a3fc76f6f42d1328bf8713120d6261d2e613e9a81033887cbcc
    container_name: swag
    cap_add:
      - NET_ADMIN
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - URL=ryandlewis.dev
      - SUBDOMAINS=warden,request,cloud,foundry,jellyfin,plex,neofoundry,immich,audiobookshelf,collabora
      - ONLY_SUBDOMAINS=true
      - VALIDATION=http
      - EMAIL=public+letsencrypt@ryandlewis.dev
    volumes:
      - /home/luckierdodge/cerberus-storage/config/swag:/config
    ports:
      - 443:443
      - 80:80
    restart: unless-stopped
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest@sha256:16a2c6a6ba7d60d825d73c682ba3036ca3877fe34f73dab9c88854bc099e1164
    container_name: librespeed
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - PASSWORD=${LIBRESPEED_PASSWORD:-supersecretpassword}
    volumes:
      - /home/luckierdodge/cerberus-storage/config/librespeed/config:/config
    ports:
      # Tailnet-only: nothing needs the speed test from the internet
      - 100.93.94.128:8889:80
      - "[fd7a:115c:a1e0:ab12:4843:cd96:625d:5e80]:8889:80"
    restart: unless-stopped
  gatus:
    image: twinproduction/gatus:latest@sha256:0a8565a61a3c10c9ae622999f576eb2b5be512ca5fdd17de776cb4bfc0160ff2
    container_name: gatus
    restart: unless-stopped
    env_file: ./gatus.env
    ports:
      # Tailnet-only: nothing needs the status page from the internet
      - 100.93.94.128:8090:8080
      - "[fd7a:115c:a1e0:ab12:4843:cd96:625d:5e80]:8090:8080"
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - /home/luckierdodge/cerberus-storage/data/gatus/data:/data
