# Aegis's Gatus watches SleeperService, which runs the main Gatus and ntfy
# (nix-config modules/infra/gatus.nix, ntfy.nix). When SleeperService is
# down, ntfy is down with it, so this one alerts through Discord. It also
# keeps the checks only a container on Aegis's Docker network can make.

storage:
  type: sqlite
  path: /data/data.db

alerting:
  discord:
    webhook-url: ${DISCORD_WEBHOOK_URL}
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true

endpoints:
  # ---------- SleeperService, over the tailnet and from outside ----------
  - name: ssh
    group: sleeperservice
    url: tcp://sleeperservice:22
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  - name: gatus
    group: sleeperservice
    url: http://sleeperservice:8080/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  - name: ntfy
    group: sleeperservice
    url: https://ntfy.ryandlewis.dev/v1/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].healthy == true"
    alerts:
      - type: discord

  - name: nginx-test
    group: sleeperservice
    url: https://test.ryandlewis.dev/
    interval: 60s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: discord

  # ---------- Only reachable on Aegis's Docker network ----------
  - name: redis
    group: aegis
    url: tcp://redis:6379
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord

  - name: nc-postgres
    group: aegis
    url: tcp://nc_postgres:5432
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: discord
