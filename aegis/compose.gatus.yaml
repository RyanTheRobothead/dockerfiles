services:
  gatus:
    image: twinproduction/gatus:latest@sha256:375c7365d2a89506da18b8a2540a383f5af0858a1eeeb5495151bf97b17b42f3
    container_name: gatus
    restart: unless-stopped
    env_file: ./gatus.env
    ports:
      - 8090:8080
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - ${DATA_DIR}/gatus/data:/data
    labels:
      - docker-volume-backup.stop-during-backup=true
