    container_name: gatus
    restart: unless-stopped
    env_file: ./gatus.env
    ports:
      - 100.117.195.49:8090:8080
      - "[fd7a:115c:a1e0::b537:c331]:8090:8080"
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - ${DATA_DIR}/gatus/data:/data
