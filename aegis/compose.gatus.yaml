services:
  gatus:
    image: twinproduction/gatus:latest@sha256:085ed63da963728965d00a3c78aa6167e3bf135218485b893201758e079e8415
    container_name: gatus
    restart: unless-stopped
    env_file: ./gatus.env
    ports:
      - 8090:8080
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - ${DATA_DIR}/gatus/data:/data
    labels:
      - docker-volume-backup.stop-during-backup=true
