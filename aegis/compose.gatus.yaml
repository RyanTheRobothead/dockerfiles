services:
  gatus:
    image: twinproduction/gatus:latest@sha256:d04f9cc90641cb9728fa04c635da5c290258047c91ca0d3b3a50da7be407c5cf
    container_name: gatus
    restart: unless-stopped
    env_file: ./gatus.env
    ports:
      - 8090:8080
    volumes:
      - ./gatus/config.yaml:/config/config.yaml:ro
      - ${DATA_DIR}/gatus/data:/data
    labels:
      - docker-volume-backup.stop-during-backup=true
