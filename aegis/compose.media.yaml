services:
  plex:
    container_name: plex
    image: plexinc/pms-docker@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
    restart: unless-stopped
    # Host networking so Plex advertises its real LAN IP and GDM discovery works.
    # On the bridge it only advertised 172.18.x, so LAN clients fell back to
    # plex.ryandlewis.dev and hairpinned through cerberus as WAN sessions.
    # DLNA is disabled in Plex settings, so no fight with Spotify over 1900/udp.
    network_mode: host
    environment:
      - TZ=America/Chicago
      - PLEX_CLAIM=<https://www.plex.tv/claim>
      - ADVERTISE_IP=https://plex.ryandlewis.dev/
      - PLEX_UID=1000
      - PLEX_GID=100
    volumes:
      - ${DATA_DIR}/plex/config:/config
      - ${DATA_DIR}/plex/transcode:/transcode
      - ${DOWNLOADS_DIR}/media:/data
      - ${MEDIA_DIR}:/media-storage
      - ${MEDIA_DIR_JAINA}:/jaina-media
      - ${DATA_DIR}/nextcloud/data/luckierdodge/files/Music:/music
      - ${DATA_DIR}/nextcloud/data/luckierdodge/files/Pictures:/Pictures
    labels:
      - docker-volume-backup.stop-during-backup=true
  sonarr:
    image: linuxserver/sonarr@sha256:3b8c947d7fa173f70e40047d2c8d02835fb8416aeb5ae36def57d9ad15e2f906
    container_name: sonarr
    depends_on: ["gluetun"]
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - UMASK_SET=022
    volumes:
      - ${DATA_DIR}/sonarr/config:/config
      - ${DOWNLOADS_DIR}/media:/media
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=true
  radarr:
    image: linuxserver/radarr@sha256:ade5937813c6ae415b29db729386e53fea3ecf067a019849bafbe2d2a6ec02ba
    container_name: radarr
    depends_on: ["gluetun"]
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - UMASK_SET=022
    volumes:
      - ${DATA_DIR}/radarr/config:/config
      - ${DOWNLOADS_DIR}/media:/media
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=true
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest@sha256:d5707cfe084da21a3864c7ef0edd9c0543b5e26c79c551f84dad5ef8683af8c7
    container_name: lidarr
    depends_on: ["gluetun"]
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
    volumes:
      - ${DATA_DIR}/lidarr/config:/config
      - ${DOWNLOADS_DIR}/media:/media
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=true
  nzbget:
    image: lscr.io/linuxserver/nzbget@sha256:6f86d5cb17fa12c214e0c699addde8ee5b9622fbafd2f4dc2eb8f89e7251dc49
    container_name: nzbget
    depends_on: ["gluetun"]
    network_mode: service:gluetun
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
    volumes:
      - ${DATA_DIR}/nzbget/config:/config
      - ${DOWNLOADS_DIR}/media:/media #optional
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=true
  ombi:
    image: ghcr.io/linuxserver/ombi@sha256:cdff52cca1c613aaf67e72bf36de5ea8486fa43fe2c2b7e2dd3368d6a80510d7
    container_name: ombi
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
    volumes:
      - ${DATA_DIR}/ombi/config:/config
    depends_on: ["gluetun"]
    network_mode: service:gluetun
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=true
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest@sha256:b7eabe1f098f4e850bfd63d6721369117195410a471db1a41748ab768b81a639
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      # Don't set JELLYFIN_PublishedServerUrl: it overrides PublishedServerUriBySubnet
      # for every client, sending LAN clients out through cerberus. The LAN/public
      # split lives in network.xml (LocalNetworkSubnets, PublishedServerUriBySubnet).
    volumes:
      - ${DATA_DIR}/jellyfin/config:/config
      - ${DOWNLOADS_DIR}/media/tv:/data/tvshows
      - ${DOWNLOADS_DIR}/media/movies:/data/movies
      - ${MEDIA_DIR_JAINA}:/data/jaina-media
    # Host networking (8096, 8920, 7359/udp) so Jellyfin has an interface on the
    # LAN: PublishedServerUriBySubnet only applies a subnet override when an
    # interface sits in that subnet, and discovery broadcasts need to reach it.
    # No DLNA plugin installed, so nothing contends with Spotify for 1900/udp.
    network_mode: host
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=true
  gluetun:
    image: qmcgaw/gluetun@sha256:78c09588169ad05b9f88bc492ac8f80e6167e93da7526171863c0dfb88bf18d6
    container_name: gluetun
    restart: unless-stopped
    env_file: ./gluetun.env
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Admin UIs are tailnet-only (Aegis's Tailscale address); Ombi and the
      # torrent port stay on every interface
      #- 9117:9117 # Jackett
      - 100.117.195.49:7070:7070 # QBittorrent
      - "[fd7a:115c:a1e0::b537:c331]:7070:7070"
      - 100.117.195.49:9696:9696 # Prowlarr
      - "[fd7a:115c:a1e0::b537:c331]:9696:9696"
      - 100.117.195.49:6881:6881 # QBittorrent Incoming Port
      - "[fd7a:115c:a1e0::b537:c331]:6881:6881"
      - 100.117.195.49:8989:8989 # Sonarr
      - "[fd7a:115c:a1e0::b537:c331]:8989:8989"
      - 100.117.195.49:7878:7878 # Radarr
      - "[fd7a:115c:a1e0::b537:c331]:7878:7878"
      - 100.117.195.49:8686:8686 # Lidarr
      - "[fd7a:115c:a1e0::b537:c331]:8686:8686"
      - 100.117.195.49:6789:6789 # Nzbget
      - "[fd7a:115c:a1e0::b537:c331]:6789:6789"
      - 100.117.195.49:3579:3579 # Ombi
      - "[fd7a:115c:a1e0::b537:c331]:3579:3579"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - SERVER_COUNTRIES=United States
      - PORT_FORWARD_ONLY=on
  #jackett:
  #  image: linuxserver/jackett
  #  container_name: jackett
  #  depends_on: ["gluetun"]
  #  network_mode: service:gluetun
  #  restart: no
  #  environment:
  #    - PUID=1000
  #    - PGID=100
  #    - TZ=America/Chicago
  #    - AUTO_UPDATE=true
  #  volumes:
  #    - /etc/localtime:/etc/localtime:ro
  #    - ${DATA_DIR}/jackett/config:/config:z
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:431d7efebcef466e56adaa40a7a2fa2b0e85159a037b8bf465eaadbf0cf5bedf
    container_name: prowlarr
    depends_on: ["gluetun"]
    network_mode: service:gluetun
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
    volumes:
      - ${DATA_DIR}/prowlarr/config:/config
    labels:
      - docker-volume-backup.stop-during-backup=true
  qbittorrent:
    image: linuxserver/qbittorrent@sha256:05c1454f9a32967affc1f34f67f8cc0cc57dd805dca45489fe797095a6286556
    container_name: qbittorrent
    depends_on: ["gluetun"]
    network_mode: service:gluetun
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
      - WEBUI_PORT=7070
      - TORRENTING_PORT=6881
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${DATA_DIR}/qbittorrent/config:/config:z
      - ${DOWNLOADS_DIR}/media/downloads:/media/downloads:z
      - ${DOWNLOADS_DIR}/media/movies:/media/movies:z
      - ${DOWNLOADS_DIR}/media/tv:/media/tv:z
      - ${DOWNLOADS_DIR}/media/music:/media/music:z
    labels:
      - docker-volume-backup.stop-during-backup=true
  audiobookshelf:
    container_name: audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:latest@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa
    ports:
      - 100.117.195.49:13378:80
      - "[fd7a:115c:a1e0::b537:c331]:13378:80"
    volumes:
      # These volumes are needed to keep your library persistent
      # and allow media to be accessed by the ABS server.
      - ${DATA_DIR}/audiobookshelf/config:/config
      - ${DATA_DIR}/audiobookshelf/metadata:/metadata
      # The path to the left of the colon is the path on your computer,
      # and the path to the right of the colon is where the data is
      # available to ABS in Docker. You can change these lines freely
      # or add additional mounts for additional libraries.
      - ${MEDIA_DIR}/audiobooks:/audiobooks
      - ${MEDIA_DIR}/podcasts:/podcasts
    environment:
      - TZ=America/Chicago
      # Add other environment variables here
    restart: unless-stopped
    # Audiobookshelf does not use PUID or GUID environment variables.
    # To run as a different user, use the following directive.
    user: 1000:100
    labels:
      - docker-volume-backup.stop-during-backup=true
