services:
  paperless_broker:
    container_name: paperless_broker
    image: docker.io/valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    volumes:
      - ${DATA_DIR}/paperless/data/paperless_brokerdata:/data
    labels:
      - docker-volume-backup.stop-during-backup=true
  paperless_db:
    container_name: paperless_db
    image: docker.io/library/postgres:18@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    restart: unless-stopped
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory of this mount
      - ${DATA_DIR}/paperless/data/paperless_pg:/var/lib/postgresql
    env_file: paperless_db.env
    labels:
      - docker-volume-backup.stop-during-backup=true
  paperless_webserver:
    container_name: paperless_webserver
    image: ghcr.io/paperless-ngx/paperless-ngx:latest@sha256:d232cba37cc0bab0d6c6581ecd320383b7a6f49f33e0fd16adda4d009eb600dd
    restart: unless-stopped
    depends_on:
      - paperless_db
      - paperless_broker
      - gotenberg
      - tika
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fs", "-S", "--max-time", "2", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ${DATA_DIR}/paperless/data/paperless_data:/usr/src/paperless/data
      - ${DATA_DIR}/paperless/data/paperless_media:/usr/src/paperless/media
      - ${DATA_DIR}/paperless/data/paperless_export:/usr/src/paperless/export
      - ${DATA_DIR}/paperless/data/paperless_consume:/usr/src/paperless/consume
    env_file: paperless_webserver.env
    environment:
      PAPERLESS_REDIS: redis://paperless_broker:6379
      PAPERLESS_DBHOST: paperless_db
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
    labels:
      - docker-volume-backup.stop-during-backup=true
  gotenberg:
    container_name: gotenberg
    image: docker.io/gotenberg/gotenberg:8.38@sha256:aa552cc115db488e0f0bcb07446aac13071ad51505b642c84bb894500907b42b
    restart: unless-stopped
    # The gotenberg chromium route is used to convert .eml files. We do not
    # want to allow external content like tracking pixels or even javascript.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=^file:///tmp/.*"
  tika:
    container_name: tika
    image: docker.io/apache/tika:latest@sha256:06bcdbd09aca073293e5a171ad161418cc93c91d58d9e4e205064eade84889d4
    restart: unless-stopped
