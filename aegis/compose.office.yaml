  vaultwarden:
    image: vaultwarden/server:latest@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: vaultwarden
    env_file: vaultwarden.env
    environment:
      # WebAuthn binds keys to this origin; unset, it defaults to localhost
      # and every security key registration fails
      - DOMAIN=https://warden.ryandlewis.dev
    volumes:
      - ${DATA_DIR}/vaultwarden/data:/data
    ports:
      - 28080:80
      - 23012:3012
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=true
  nextcloud:
    image: ghcr.io/linuxserver/nextcloud@sha256:e7f790011bf023d33517b4be70231d7aa2e19d54c619664a8533e8bedd4716ac
    container_name: nextcloud
    # Lets php-fpm's slowlog ptrace its workers for stack traces.
    cap_add:
      - SYS_PTRACE
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/Chicago
    volumes:
      - ${DATA_DIR}/nextcloud/config:/config
      - ${DATA_DIR}/nextcloud/data:/data
    ports:
      - 21443:443
    restart: unless-stopped
    labels:
      - docker-volume-backup.stop-during-backup=true
  collabora:
    # Nextcloud Office's editor, reached through SWAG on Cerberus as
    # collabora.ryandlewis.dev. Standalone rather than the richdocumentscode
    # app, which CVE-2026-110447 hit and this container is not exposed to.
    image: collabora/code@sha256:bb8f3c9c5c9016045f25fccb5f0649be94469ebc7c7cc379f3576e470cccf33d
    container_name: collabora
    environment:
      - aliasgroup1=https://cloud.ryandlewis.dev:443
      - server_name=collabora.ryandlewis.dev
      # SWAG terminates TLS
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    ports:
      # Tailnet-only, for SWAG on Cerberus
      - 100.117.195.49:9980:9980
      - "[fd7a:115c:a1e0::b537:c331]:9980:9980"
    restart: unless-stopped
  redis:
    container_name: redis
    image: redis@sha256:97ec88159e6d7cfb5ddef9015386087d58a912de80112f06ebdfa78fa5989901
    restart: unless-stopped
  nc_postgres:
    container_name: nc_postgres
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    env_file: nextcloud_postgres.env
    volumes:
      # Postgres 18+ keeps its data in a versioned subdirectory of this mount
      - ${DATA_DIR}/nc_postgres/pg:/var/lib/postgresql
    labels:
      - docker-volume-backup.stop-during-backup=true
